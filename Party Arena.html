document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lex; flex-direction: column;\">\n\n<div style=\"height: 10px; background-image: repeating-linear-gradient(115deg,#FF5FA2 0 28px,#FFC400 28px 56px); animation: pa-stripe 1.4s linear infinite; flex-shrink: 0;\"><\u002Fdiv>\n\n<div style=\"display: flex; align-items: center; justify-content: space-between; padding: 20px 44px; border-bottom: 4px solid #2E2A45; flex-shrink: 0;\">\n  <div style=\"display: flex; align-items: baseline; gap: 16px;\">\n    <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em; color: #E5382F;\">SEVERANCE PACKAGE<\u002Fdiv>\n    <div style=\"font-weight: 900; font-size: 12px; letter-spacing: 0.22em; color: #8B84A6;\">OFFICE PARTY ARENA<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding: 8px 18px; border-radius: 999px; background: #FFFFFF; border: 3px solid #2E2A45; font-family: Fredoka,sans-serif; font-weight: 600; font-size: 17px; letter-spacing: 0.12em;\">{{ roundLabel }}<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1; display: flex; min-height: 0;\">\n<div style=\"flex: 1; display: flex; flex-direction: column; min-width: 0;\">\n\n<sc-if value=\"{{ isLobby }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 52px; gap: 34px;\">\n  <div>\n    <div style=\"font-weight: 900; font-size: 13px; letter-spacing: 0.24em; color: #FF7A2E; margin-bottom: 12px;\">WAITING ROOM<\u002Fdiv>\n    <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 70px; line-height: 0.95; letter-spacing: -0.03em; max-width: 15ch; text-wrap: balance;\">Grab your phone. It's your controller.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; gap: 28px; align-items: stretch;\">\n    <div style=\"background: #FFC400; color: #2E2A45; border: 4px solid #2E2A45; border-radius: 20px; padding: 22px 30px; display: flex; flex-direction: column; gap: 4px; justify-content: center;\">\n      <div style=\"font-weight: 900; font-size: 12px; letter-spacing: 0.2em; opacity: .6;\">ROOM CODE<\u002Fdiv>\n      <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 74px; line-height: 1; letter-spacing: 0.06em;\">{{ roomCode }}<\u002Fdiv>\n      <div style=\"font-weight: 700; font-size: 16px; opacity: .7;\">party.arena / join<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width: 178px; height: 178px; border-radius: 20px; background: #FFFFFF; border: 4px solid #2E2A45; padding: 12px; flex-shrink: 0;\">\n      <div style=\"width: 100%; height: 100%; border-radius: 6px; background-image: repeating-linear-gradient(45deg,#2E2A45 0 6px,#FFFFFF 6px 12px); display: flex; align-items: center; justify-content: center;\">\n        <div style=\"background: #FFFFFF; color: #2E2A45; font-family: ui-monospace,monospace; font-size: 10px; font-weight: 700; padding: 6px 7px; text-align: center; line-height: 1.3;\">JOIN QR<br>goes here<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0;\">\n      <div style=\"font-size: 19px; line-height: 1.5; color: #6B6486; max-width: 34ch;\">Five games, drawn at random. Placement points every round. One name ends up on top of that board.<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">\n        <div style=\"padding: 7px 14px; border-radius: 999px; border: 3px solid #2E2A45; font-weight: 900; font-size: 12px; letter-spacing: 0.12em; color: #6B6486;\">5–8 PLAYERS<\u002Fdiv>\n        <div style=\"padding: 7px 14px; border-radius: 999px; border: 3px solid #2E2A45; font-weight: 900; font-size: 12px; letter-spacing: 0.12em; color: #6B6486;\">~12 MINUTES<\u002Fdiv>\n        <div style=\"padding: 7px 14px; border-radius: 999px; border: 3px solid #2E2A45; font-weight: 900; font-size: 12px; letter-spacing: 0.12em; color: #6B6486;\">NO HOST NEEDED<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; gap: 20px;\">\n    <div sc-camel-on-click=\"{{ startRun }}\" style=\"cursor: pointer; background: #FF5FA2; color: #FFFFFF; border: 4px solid #2E2A45; border-radius: 18px; padding: 20px 40px; font-family: Fredoka,sans-serif; font-weight: 700; font-size: 28px; box-shadow: 0 7px 0 #2E2A45;\" style-hover=\"transform: translateY(2px); box-shadow: 0 5px 0 #2E2A45;\">Start the run<\u002Fdiv>\n    <div style=\"font-weight: 700; font-size: 15px; color: #8B84A6; animation: pa-pulse 2.4s ease-in-out infinite;\">Anyone can press it. That's the whole rule.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReveal }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 52px; gap: 24px;\">\n  <div style=\"font-weight: 900; font-size: 13px; letter-spacing: 0.24em; color: #FF7A2E;\">NEXT UP · GAME {{ gameNumber }} OF 5<\u002Fdiv>\n  <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 92px; line-height: 0.92; letter-spacing: -0.035em; color: #E5382F; max-width: 13ch; animation: pa-rise .35s ease-out;\">{{ gameName }}<\u002Fdiv>\n  <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n    <div style=\"padding: 9px 18px; border-radius: 999px; background: #FFFFFF; border: 3px solid #2E2A45; font-weight: 900; font-size: 13px; letter-spacing: 0.12em;\">{{ gameFormat }}<\u002Fdiv>\n    <div style=\"padding: 9px 18px; border-radius: 999px; background: #FFFFFF; border: 3px solid #2E2A45; font-weight: 900; font-size: 13px; letter-spacing: 0.12em;\">{{ gameInput }}<\u002Fdiv>\n    <div style=\"padding: 9px 18px; border-radius: 999px; background: #FFFFFF; border: 3px solid #2E2A45; font-weight: 900; font-size: 13px; letter-spacing: 0.12em;\">{{ gameLength }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background: #FFFFFF; border: 3px solid #2E2A45; border-left: 12px solid #FF5FA2; border-radius: 18px; padding: 26px 30px; max-width: 62ch;\">\n    <div style=\"font-weight: 900; font-size: 12px; letter-spacing: 0.2em; color: #8B84A6; margin-bottom: 10px;\">HOW YOU WIN<\u002Fdiv>\n    <div style=\"font-size: 24px; line-height: 1.45; text-wrap: pretty;\">{{ gameRules }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; gap: 18px;\">\n    <div sc-camel-on-click=\"{{ beginGame }}\" style=\"cursor: pointer; background: #FF5FA2; color: #FFFFFF; border: 4px solid #2E2A45; border-radius: 18px; padding: 18px 36px; font-family: Fredoka,sans-serif; font-weight: 700; font-size: 26px; box-shadow: 0 7px 0 #2E2A45;\" style-hover=\"transform: translateY(2px); box-shadow: 0 5px 0 #2E2A45;\">Everyone ready<\u002Fdiv>\n    <div style=\"font-weight: 700; font-size: 15px; color: #8B84A6;\">Check your phone — controls change every game.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 52px; gap: 24px; text-align: center;\">\n  <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 56px; letter-spacing: -0.02em; color: #E5382F;\">{{ gameName }}<\u002Fdiv>\n  <div style=\"width: 100%; max-width: 860px; height: 280px; border-radius: 20px; border: 4px dashed #C6BFD8; background-image: repeating-linear-gradient(45deg,#FFFFFF 0 10px,#FFF8E8 10px 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;\">\n    <div style=\"font-family: ui-monospace,monospace; font-size: 14px; color: #8B84A6; letter-spacing: 0.1em;\">MINIGAME CANVAS<\u002Fdiv>\n    <div style=\"font-size: 18px; color: #6B6486; max-width: 44ch;\">Live playfield renders here. Phones drive it; this screen is the shared truth.<\u002Fdiv>\n  <\u002Fdiv>\n  <div sc-camel-on-click=\"{{ finishGame }}\" style=\"cursor: pointer; background: #3FD9A8; color: #17434A; border-radius: 16px; padding: 16px 34px; font-family: Fredoka,sans-serif; font-weight: 700; font-size: 23px; box-shadow: 0 6px 0 #2E2A45;\" style-hover=\"transform: translateY(2px); box-shadow: 0 4px 0 #2E2A45;\">Simulate result<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 36px 52px; gap: 22px;\">\n  <div>\n    <div style=\"font-weight: 900; font-size: 13px; letter-spacing: 0.24em; color: #FF7A2E; margin-bottom: 8px;\">{{ gameName }} · RESULT<\u002Fdiv>\n    <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 62px; line-height: 1; letter-spacing: -0.03em;\">{{ winnerLine }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 760px;\">\n    <sc-for list=\"{{ lastResults }}\" as=\"row\" hint-placeholder-count=\"6\">\n      <div style=\"display: flex; align-items: center; gap: 16px; background: #FFFFFF; border: 3px solid #2E2A45; border-radius: 14px; padding: 10px 18px;\">\n        <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 24px; width: 44px; color: #8B84A6;\">{{ row.place }}<\u002Fdiv>\n        <div style=\"width: 34px; height: 34px; border-radius: 10px; background: {{ row.color }}; color: #2E2A45; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center;\">{{ row.initial }}<\u002Fdiv>\n        <div style=\"flex: 1; font-weight: 700; font-size: 21px;\">{{ row.name }}<\u002Fdiv>\n        <div style=\"font-size: 15px; color: #8B84A6; font-weight: 700;\">{{ row.note }}<\u002Fdiv>\n        <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 22px; color: #E5382F; width: 62px; text-align: right;\">{{ row.gain }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div sc-camel-on-click=\"{{ nextGame }}\" style=\"align-self: flex-start; cursor: pointer; background: #FF5FA2; color: #FFFFFF; border: 4px solid #2E2A45; border-radius: 18px; padding: 17px 34px; font-family: Fredoka,sans-serif; font-weight: 700; font-size: 25px; box-shadow: 0 7px 0 #2E2A45;\" style-hover=\"transform: translateY(2px); box-shadow: 0 5px 0 #2E2A45;\">{{ nextLabel }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isFinal }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px 52px; gap: 28px;\">\n  <div style=\"font-weight: 900; font-size: 13px; letter-spacing: 0.24em; color: #FF7A2E;\">RUN COMPLETE<\u002Fdiv>\n  <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 96px; line-height: 0.92; letter-spacing: -0.035em; color: #E5382F;\">{{ championLine }}<\u002Fdiv>\n  <div style=\"font-size: 22px; color: #6B6486; max-width: 40ch; line-height: 1.5;\">{{ championNote }}<\u002Fdiv>\n  <div sc-camel-on-click=\"{{ resetRun }}\" style=\"align-self: flex-start; cursor: pointer; background: #FF5FA2; color: #FFFFFF; border: 4px solid #2E2A45; border-radius: 18px; padding: 18px 36px; font-family: Fredoka,sans-serif; font-weight: 700; font-size: 26px; box-shadow: 0 7px 0 #2E2A45;\" style-hover=\"transform: translateY(2px); box-shadow: 0 5px 0 #2E2A45;\">Run it back<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<div style=\"width: 400px; flex-shrink: 0; border-left: 4px solid #2E2A45; background: #FFFAF0; display: flex; flex-direction: column;\">\n  <div style=\"padding: 20px 26px 14px; display: flex; align-items: baseline; justify-content: space-between;\">\n    <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 26px;\">Scoreboard<\u002Fdiv>\n    <div style=\"font-weight: 900; font-size: 11px; letter-spacing: 0.18em; color: #8B84A6;\">{{ playerCountLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex: 1; overflow: hidden; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 8px;\">\n    <sc-for list=\"{{ board }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <div style=\"display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: {{ p.bg }}; border: 2px solid {{ p.border }};\">\n        <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 20px; width: 26px; color: #8B84A6;\">{{ p.rank }}<\u002Fdiv>\n        <div style=\"width: 38px; height: 38px; border-radius: 11px; background: {{ p.color }}; color: #2E2A45; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center;\">{{ p.initial }}<\u002Fdiv>\n        <div style=\"flex: 1; min-width: 0;\">\n          <div style=\"font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #8B84A6;\">{{ p.status }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family: Fredoka,sans-serif; font-weight: 700; font-size: 28px; color: {{ p.ptsColor }};\">{{ p.pts }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"padding: 14px 26px 20px; border-top: 4px solid #2E2A45;\">\n    <div style=\"font-weight: 900; font-size: 11px; letter-spacing: 0.18em; color: #8B84A6; margin-bottom: 10px;\">PLAYLIST<\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n      <sc-for list=\"{{ playlist }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <div style=\"display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: {{ g.color }};\">\n          <div style=\"width: 8px; height: 8px; border-radius: 999px; background: {{ g.dot }}; flex-shrink: 0;\"><\u002Fdiv>\n          <div style=\"flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ g.name }}<\u002Fdiv>\n          <div style=\"font-size: 11px; letter-spacing: 0.12em; color: #A9A2C0;\">{{ g.kind }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst GAMES = [\n  { name: \"Minefield\", kind: \"SURVIVE\", input: \"Tilt + tap\", len: \"90s\", rules: \"Outrun the harvester. Scanning for mines only works while you're near-still, so every safe step costs you ground. Last one moving takes it.\" },\n  { name: \"Chisel Gauntlet\", kind: \"RACE\", input: \"Tap to chip\", len: \"75s\", rules: \"Memorise the carved block, then chip your own cube to match it from memory. Exact shape only. Closest-and-fastest wins.\" },\n  { name: \"Crusher Escalator\", kind: \"SURVIVE\", input: \"Swipe\", len: \"60s\", rules: \"Hit the directional sequence on the beat to climb. Wrong swipes bleed momentum. The crusher does not care how you're feeling.\" },\n  { name: \"Safe Tile Arena\", kind: \"SURVIVE\", input: \"Joystick\", len: \"90s\", rules: \"One tile type is safe each phase. Everything else drops away. Shoving is not only allowed, it is the intended solution.\" },\n  { name: \"Pea Dinner\", kind: \"RACE\", input: \"Drag\", len: \"70s\", rules: \"Eat peas while he's looking down. Freeze the instant he looks up — any movement and you're out. First clean plate wins.\" },\n  { name: \"Train Alcoves\", kind: \"SURVIVE\", input: \"Tap lane\", len: \"80s\", rules: \"Six alcoves, a green/red pattern, and never enough safe space. Claim a green one before the train, or take someone else's.\" },\n  { name: \"Blade Arena\", kind: \"SURVIVE\", input: \"Joystick\", len: \"90s\", rules: \"Blades launch from three crawl spaces and ricochet forever, faster and more numerous each wave. Dodge longer than everyone else.\" },\n  { name: \"Stop the Clock\", kind: \"PRECISION\", input: \"Tap\", len: \"30s\", rules: \"A target between 2 and 8 seconds. Stop your own timer as close as you dare. Nobody sees a thing until everyone has stopped.\" },\n  { name: \"Type Racer Roulette\", kind: \"RACE\", input: \"Keyboard\", len: \"80s\", rules: \"Race through the text. Three mistakes trigger an elimination roll, and surviving one makes the next roll worse. First to the end wins.\" },\n  { name: \"Liar's Deck\", kind: \"SURVIVE\", input: \"Tap cards\", len: \"120s\", rules: \"Play cards face-down and claim they match the round's rank. Anyone can call liar — the reveal decides who eats the penalty.\" }\n];\n\nconst COLORS = [\"#FFC400\",\"#FF9E4F\",\"#6FD0FF\",\"#9CE86A\",\"#FF8FC4\",\"#C4A8FF\",\"#FFE066\",\"#5FE3C0\"];\nconst NAMES = [\"Priya\",\"Marcus\",\"Dee\",\"Yusuf\",\"Hanna\",\"Tomas\",\"Ola\",\"Ren\"];\nconst PTS = [10, 7, 5, 3, 2, 1, 1, 0];\n\nfunction pickPlaylist() {\n  const survive = GAMES.filter(g => g.kind === \"SURVIVE\");\n  const other = GAMES.filter(g => g.kind !== \"SURVIVE\");\n  const shuf = a => a.slice().sort(() => Math.random() - 0.5);\n  const s = shuf(survive), o = shuf(other);\n  // interleave so no more than two eliminations run back to back\n  const out = [];\n  while (out.length < 5) {\n    if (o.length && (out.length % 2 === 1 || !s.length)) out.push(o.shift());\n    else if (s.length) out.push(s.shift());\n    else out.push(o.shift());\n  }\n  return out;\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      phase: \"lobby\",\n      idx: 0,\n      playlist: pickPlaylist(),\n      players: NAMES.slice(0, 6).map((n, i) => ({ name: n, color: COLORS[i], pts: 0, gain: 0, place: 0, note: \"\" })),\n      roomCode: \"GRND\"\n    };\n  }\n\n  game() { return this.state.playlist[Math.min(this.state.idx, 4)]; }\n\n  simulate() {\n    const g = this.game();\n    const order = this.state.players.slice().sort(() => Math.random() - 0.5);\n    const notes = {\n      SURVIVE: [\"last standing\", \"out at the wire\", \"clipped early\", \"shoved out\", \"misread the pattern\", \"did not make it\"],\n      RACE: [\"first over the line\", \"half a second back\", \"fumbled the finish\", \"steady, not fast\", \"lost the thread\", \"never got going\"],\n      PRECISION: [\"off by 0.04s\", \"off by 0.11s\", \"off by 0.29s\", \"off by 0.62s\", \"off by 1.15s\", \"off by 2.40s\"]\n    }[g.kind];\n    const players = this.state.players.map(p => {\n      const i = order.findIndex(o => o.name === p.name);\n      const gain = PTS[i] ?? 0;\n      return { ...p, pts: p.pts + gain, gain, place: i + 1, note: notes[Math.min(i, notes.length - 1)] };\n    });\n    this.setState({ players, phase: \"results\" });\n  }\n\n  renderVals() {\n    const s = this.state, g = this.game();\n    const phase = s.phase;\n    const ranked = s.players.slice().sort((a, b) => b.pts - a.pts);\n    const lastResults = s.players.slice().sort((a, b) => a.place - b.place).map(p => ({\n      place: p.place + \".\", name: p.name, color: p.color, initial: p.name[0],\n      note: p.note, gain: p.gain > 0 ? \"+\" + p.gain : \"—\"\n    }));\n    const leader = ranked[0];\n    const tied = ranked.filter(p => p.pts === leader.pts).length > 1;\n    const last = s.idx >= 4;\n\n    return {\n      isLobby: phase === \"lobby\", isReveal: phase === \"reveal\", isPlaying: phase === \"playing\",\n      isResults: phase === \"results\", isFinal: phase === \"final\",\n      roomCode: s.roomCode,\n      roundLabel: phase === \"lobby\" ? \"NOT STARTED\" : phase === \"final\" ? \"FINISHED\" : \"GAME \" + (s.idx + 1) + \" / 5\",\n      gameNumber: s.idx + 1,\n      gameName: g.name, gameRules: g.rules,\n      gameFormat: g.kind === \"SURVIVE\" ? \"LAST SURVIVOR\" : g.kind === \"RACE\" ? \"RACE TO FINISH\" : \"PRECISION\",\n      gameInput: g.input.toUpperCase(), gameLength: \"~\" + g.len,\n      winnerLine: (lastResults[0]?.name || \"Nobody\") + \" takes it.\",\n      lastResults,\n      nextLabel: last ? \"Final standings\" : \"Next game\",\n      championLine: tied ? \"Dead heat.\" : leader.name + \" wins the night.\",\n      championNote: tied\n        ? \"Two people finished level on points. Sudden death is Stop the Clock, and it is not negotiable.\"\n        : leader.pts + \" points across five games. Everyone else can take it up with HR.\",\n      playerCountLabel: s.players.length + \" PLAYERS\",\n      board: ranked.map((p, i) => ({\n        rank: i + 1, name: p.name, initial: p.name[0], color: p.color, pts: p.pts,\n        status: p.gain > 0 ? \"+\" + p.gain + \" LAST GAME\" : phase === \"lobby\" ? \"READY\" : \"NO POINTS\",\n        bg: i === 0 && p.pts > 0 ? \"#FFE9A3\" : \"#FFFFFF\",\n        border: \"#2E2A45\",\n        ptsColor: i === 0 && p.pts > 0 ? \"#E5382F\" : \"#2E2A45\"\n      })),\n      playlist: s.playlist.map((x, i) => ({\n        name: (i + 1) + \". \" + x.name, kind: x.kind,\n        color: i === s.idx && phase !== \"lobby\" ? \"#FFC400\" : i < s.idx ? \"#5E5747\" : \"#B9AF98\",\n        dot: i === s.idx && phase !== \"lobby\" ? \"#FF4D2E\" : i < s.idx ? \"#3A3225\" : \"#7C7361\"\n      })),\n      startRun: () => this.setState({ phase: \"reveal\" }),\n      beginGame: () => this.setState({ phase: \"playing\" }),\n      finishGame: () => this.simulate(),\n      nextGame: () => last ? this.setState({ phase: \"final\" }) : this.setState({ idx: s.idx + 1, phase: \"reveal\" }),\n      resetRun: () => this.setState({\n        phase: \"lobby\", idx: 0, playlist: pickPlaylist(),\n        players: s.players.map(p => ({ ...p, pts: 0, gain: 0, place: 0, note: \"\" }))\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
