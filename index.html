<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Party Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff1d0;
        /* Entrance animations slide in from the side; never let them add a scrollbar. */
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      button {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      * {
        box-sizing: border-box;
      }
      button {
        font: inherit;
      }
      @keyframes pa-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      @keyframes pa-rise {
        from {
          transform: translateY(16px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes pa-float {
        0%,
        100% {
          transform: translate(0, 0) rotate(-4deg);
        }
        33% {
          transform: translate(14px, -18px) rotate(5deg);
        }
        66% {
          transform: translate(-10px, 12px) rotate(-2deg);
        }
      }
      /*
       * Rise only, no scale: scaling a full-width pane pulls its left and
       * right edges inward while it plays, which reads as the content being
       * clipped rather than arriving.
       */
      @keyframes pa-swoop {
        from {
          transform: translateY(26px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes pa-slide-in {
        from {
          transform: translateX(60px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      /*
       * The handoff from the ready check into a round. Longer and softer than
       * pa-swoop: the whole screen changes at once there — header and
       * scoreboard included — so it needs easing into rather than snapping.
       */
      @keyframes pa-enter {
        from {
          transform: translateY(18px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes pa-pop {
        from {
          transform: scale(0.6) rotate(-8deg);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      /* Screen swipe: three bands cross the screen sideways, in and then out the far side. */
      @keyframes pa-swipe-in-from-left {
        from { transform: translateX(-101%); }
        to { transform: translateX(0); }
      }
      @keyframes pa-swipe-in-from-right {
        from { transform: translateX(101%); }
        to { transform: translateX(0); }
      }
      @keyframes pa-swipe-out-to-right {
        from { transform: translateX(0); }
        to { transform: translateX(101%); }
      }
      @keyframes pa-swipe-out-to-left {
        from { transform: translateX(0); }
        to { transform: translateX(-101%); }
      }
      @media (prefers-reduced-motion: reduce) {
        [style*='pa-swipe'] {
          animation-duration: 1ms !important;
          animation-delay: 0ms !important;
        }
      }
      /* Type Racer: a wrong key flashes the sheet red and shakes it. */
      @keyframes pa-type-mistake {
        0% { background: rgba(229, 56, 47, 0.55); transform: translateX(0); }
        20% { transform: translateX(-9px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(3px); }
        100% { background: rgba(229, 56, 47, 0); transform: translateX(0); }
      }
      /* Type Racer: between paragraphs the finished text clears away line by line,
         and the next one is written in line by line. */
      @keyframes pa-line-clear {
        from { opacity: 1; transform: none; filter: none; }
        to { opacity: 0; transform: translateX(40px); filter: blur(4px); }
      }
      @keyframes pa-line-in {
        from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes pa-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pa-load-shimmer {
        from { background-position: 0 0; }
        to { background-position: 28px 0; }
      }
      @keyframes pa-type-mistake-b {
        0% { background: rgba(229, 56, 47, 0.55); transform: translateX(0); }
        20% { transform: translateX(-9px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(3px); }
        100% { background: rgba(229, 56, 47, 0); transform: translateX(0); }
      }
      /* Stop the Clock demo: the tap on the STOP button. */
      @keyframes pa-demo-ripple {
        from { transform: scale(0.4); opacity: 1; }
        to { transform: scale(1.6); opacity: 0; }
      }
      @keyframes pa-bob {
        0%,
        100% {
          transform: rotate(-2deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
